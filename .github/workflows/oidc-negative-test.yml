name: OIDC negative test (temporary)

# Temporary, removed right after one run (freeappstore-online/platform#460):
# real GitHub OIDC tokens from THIS repo must not open a deploy anywhere
# except through this repo's own deploy.yml, for this app only.
on: workflow_dispatch

permissions:
  contents: read
  id-token: write

jobs:
  refused:
    runs-on: ubuntu-latest
    steps:
      - name: Each attempt must be refused
        run: |
          set -u
          tok() { curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$1" | jq -r .value; }
          fail=0
          try() {
            want=$1; label=$2; api=$3; aud=$4; body=$5
            code=$(curl -s -o /tmp/body -w '%{http_code}' -X POST "$api/v1/deploys" \
              -H "Authorization: Bearer $(tok "$aud")" -H 'Content-Type: application/json' -d "$body")
            echo "$label -> HTTP $code $(cat /tmp/body)"
            [ "$code" = "$want" ] || { echo "::error::$label: expected $want"; fail=1; }
          }
          M='{"files":{"index.html":1}}'
          FAS=https://api.freeappstore.online; FGS=https://admin.freegamestore.online
          try 403 "FAS app, from a workflow other than deploy.yml" $FAS $FAS "$M"
          try 401 "FAS app, with a token minted for the FGS audience" $FAS $FGS "$M"
          try 403 "a FAS repo writing to the FGS games bucket" $FGS $FGS "$M"
          try 400 "FAS, path traversal in the manifest" $FAS $FAS '{"files":{"index.html":1,"../calcwright/index.html":1}}'
          code=$(curl -s -o /tmp/body -w '%{http_code}' -X PUT -H 'Authorization: Bearer not-a-session-token' -H 'Content-Length: 1' --data x \
            "$FAS/v1/deploys/$(printf '%024x' 1)/files/index.html")
          echo "FAS, upload into a deploy session it does not own -> HTTP $code $(cat /tmp/body)"
          [ "$code" = 401 ] || { echo "::error::foreign session: expected 401"; fail=1; }
          exit $fail
